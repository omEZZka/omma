name: Build Omma APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK, CMake and SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      # Optional: add repository secrets TG_API_ID and TG_API_HASH (from my.telegram.org).
      # Without them the app builds, but login will not work.
      - name: Inject Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secrets are not set, building with placeholders"
            exit 0
          fi
          if ! [[ "$TG_API_ID" =~ ^[0-9]+$ ]] || ! [[ "$TG_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::TG_API_ID must be digits and TG_API_HASH must be 32 hex characters"
            exit 1
          fi
          sed -i "s/public static int APP_ID = 0;/public static int APP_ID = ${TG_API_ID};/" "$FILE"
          sed -i "s/public static String APP_HASH = \"\";/public static String APP_HASH = \"${TG_API_HASH}\";/" "$FILE"
          grep -q "APP_ID = ${TG_API_ID};" "$FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omma-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
